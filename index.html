<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絵文字日記</title>

<style>
body{
  font-family:-apple-system,sans-serif;
  text-align:center;
  background:#fafafa;
  margin:0;
  padding:20px;
}

h1{margin:10px 0;}

.card{
  max-width:420px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

input{
  width:90%;
  padding:12px;
  font-size:18px;
  text-align:center;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  margin:5px;
  width:120px;
}

button:active{transform:scale(0.95);}

#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:15px;
}

.day{
  background:#eee;
  padding:8px;
  border-radius:8px;
  min-height:40px;
  font-size:12px;
}

.today{
  background:#ffe3ea;
  border:2px solid #ff8fab;
}

nav{
  margin-top:20px;
}

.page{display:none;}
.active{display:block;}

.footer{
  font-size:12px;
  margin-top:20px;
}

.footer a{
  margin:0 10px;
  color:#666;
  text-decoration:none;
}
</style>
</head>

<body>

<h1>📔 絵文字日記</h1>

<!-- ホーム -->
<div id="home" class="page active">
  <div class="card">

    <input id="input" placeholder="😊🌧️🍜">

    <div>
      <button onclick="save()">保存</button>
      <button onclick="go('stats')">📊</button>
    </div>

    <h3 id="label"></h3>
    <div id="calendar"></div>

  </div>
</div>

<!-- stats -->
<div id="stats" class="page">
  <div class="card">
    <h2>📊 分析</h2>
    <div id="chart"></div>
    <button onclick="go('home')">戻る</button>
  </div>
</div>

<!-- about -->
<div id="about" class="page">
  <div class="card">
    <h2>About</h2>
    <p>絵文字で日記を残すシンプルアプリ</p>
    <button onclick="go('home')">戻る</button>
  </div>
</div>

<!-- privacy -->
<div id="privacy" class="page">
  <div class="card">
    <h2>Privacy</h2>
    <p>データは端末内に保存され外部送信なし</p>
    <button onclick="go('home')">戻る</button>
  </div>
</div>

<div class="footer">
  <a onclick="go('about')">About</a>
  <a onclick="go('privacy')">Privacy</a>
</div>

<script>

/* ========= ページ切替 ========= */
function go(page){
  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("active");
  });
  document.getElementById(page).classList.add("active");

  if(page==="stats") loadStats();
}

/* ========= 日記保存 ========= */
function save(){

  const val = input.value.trim();
  if(!val) return;

  const date = getToday();

  let data = JSON.parse(localStorage.getItem("diary")||"{}");

  data[date] = val;

  localStorage.setItem("diary",JSON.stringify(data));

  input.value="";
  loadCalendar();
}

/* ========= カレンダー ========= */
const cal = document.getElementById("calendar");
const input = document.getElementById("input");

loadCalendar();

function loadCalendar(){

  cal.innerHTML="";

  let data = JSON.parse(localStorage.getItem("diary")||"{}");

  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();

  document.getElementById("label").innerText =
    `${y} / ${m+1}`;

  const first = new Date(y,m,1);
  const last = new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++){
    cal.innerHTML += `<div></div>`;
  }

  for(let d=1;d<=last.getDate();d++){

    const date = format(y,m,d);
    const today = getToday();

    cal.innerHTML += `
      <div class="day ${date===today?'today':''}">
        ${d}<br>${data[date]||""}
      </div>
    `;
  }
}

/* ========= stats ========= */
function loadStats(){

  let data = JSON.parse(localStorage.getItem("diary")||"{}");

  let count={};

  Object.values(data).forEach(v=>{
    for(let e of v){
      count[e]=(count[e]||0)+1;
    }
  });

  document.getElementById("chart").innerHTML =
    Object.entries(count)
    .map(([k,v])=>`${k} ${"█".repeat(v)}`)
    .join("<br>");
}

/* ========= utils ========= */
function getToday(){
  const d=new Date();
  return format(d.getFullYear(),d.getMonth(),d.getDate());
}

function format(y,m,d){
  return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}

</script>

</body>
</html>
