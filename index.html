<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀絵文字日記</title>

<style>
body{
  font-family:-apple-system,sans-serif;
  background:#fafafa;
  text-align:center;
  margin:0;
  padding:20px;
}

.card{
  max-width:430px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:16px;
}

/* ===== タブ ===== */
.tabs{
  display:flex;
  gap:5px;
  justify-content:center;
  margin-bottom:10px;
}

.tab{
  padding:8px 12px;
  background:#eee;
  border-radius:10px;
  cursor:pointer;
}

.tab.active{
  background:#ff8fab;
  color:white;
}

/* ===== カレンダー ===== */
#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:10px;
}

.day{
  background:#eee;
  border-radius:10px;
  height:55px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

.day-num{
  position:absolute;
  top:4px;
  left:6px;
  font-size:10px;
  color:#666;
}

.today{
  border:2px solid #ff8fab;
}

/* ===== グラフ（棒） ===== */
.bar-wrap{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:10px;
  height:200px;
  margin-top:20px;
}

.bar{
  width:28px;
  background:#ff8fab;
  border-radius:6px 6px 0 0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  font-size:12px;
}

/* ラベル */
.label{
  font-size:14px;
  margin-top:6px;
}

/* ===== UI ===== */
input,select{
  padding:6px;
  margin:5px;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  margin:5px;
}
</style>
</head>

<body>

<h1>🎀絵文字日記</h1>

<!-- タブ -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('cal')">カレンダー</div>
  <div class="tab" onclick="switchTab('graph')">グラフ</div>
</div>

<!-- ================= カレンダー ================= -->
<div id="calView" class="card">

  <div id="calendar"></div>

  <hr>

  <input id="emoji" placeholder="絵文字1つ">
  <input id="comment" placeholder="コメント">

  <select id="category">
    <option value="感情">感情</option>
    <option value="ご飯">ご飯</option>
  </select>

  <button onclick="addCategory()">カテゴリ追加</button>
  <button onclick="save()">保存</button>

</div>

<!-- ================= グラフ ================= -->
<div id="graphView" class="card" style="display:none;">

  <h3>📊 グラフ</h3>

  <select id="sort" onchange="renderGraph()">
    <option value="desc">多い順</option>
    <option value="asc">少ない順</option>
  </select>

  <button onclick="mode='emoji';renderGraph()">絵文字</button>
  <button onclick="mode='category';renderGraph()">カテゴリ</button>

  <div id="graph"></div>
  <div id="labels"></div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("diary")||"{}");
let mode="emoji";

/* ===== タブ切替 ===== */
function switchTab(t){

  document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));

  if(t==="cal"){
    calView.style.display="block";
    graphView.style.display="none";
  }else{
    calView.style.display="none";
    graphView.style.display="block";
    renderGraph();
  }
}

/* ===== 保存 ===== */
function save(){

  let e=[...emoji.value].filter(c=>/\p{Emoji}/u.test(c)).join("").slice(0,1);
  let c=comment.value;
  let cat=category.value;

  let date=new Date().toISOString().slice(0,10);

  data[date]={emoji:e,comment:c,category:cat};

  localStorage.setItem("diary",JSON.stringify(data));

  draw();
}

/* ===== カレンダー ===== */
function draw(){

  let cal=document.getElementById("calendar");
  cal.innerHTML="";

  let d=new Date();
  let y=d.getFullYear();
  let m=d.getMonth();

  let first=new Date(y,m,1);
  let last=new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++) cal.innerHTML+="<div></div>";

  for(let i=1;i<=last.getDate();i++){

    let date=`${y}-${String(m+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`;

    let item=data[date];

    cal.innerHTML+=`
      <div class="day ${date===getToday()?'today':''}">
        <div class="day-num">${i}</div>
        <div>${item?item.emoji:""}</div>
      </div>
    `;
  }
}

/* ===== グラフ ===== */
function renderGraph(){

  let count={};

  for(let v of Object.values(data)){
    let key = mode==="emoji" ? v.emoji : v.category;
    if(key) count[key]=(count[key]||0)+1;
  }

  let arr=Object.entries(count);

  if(sort.value==="desc"){
    arr.sort((a,b)=>b[1]-a[1]);
  }else{
    arr.sort((a,b)=>a[1]-b[1]);
  }

  let max=Math.max(...arr.map(v=>v[1]),1);

  graph.innerHTML="";
  labels.innerHTML="";

  let wrap=document.createElement("div");
  wrap.className="bar-wrap";

  arr.forEach(([k,v])=>{

    let bar=document.createElement("div");
    bar.className="bar";
    bar.style.height=(v/max*180)+"px";
    bar.innerHTML=v;

    wrap.appendChild(bar);

    labels.innerHTML+=`<div class="label">${k}</div>`;
  });

  graph.appendChild(wrap);
}

/* ===== カテゴリ追加 ===== */
function addCategory(){

  let name=prompt("カテゴリ名");

  if(!name) return;

  let opt=document.createElement("option");
  opt.value=name;
  opt.textContent=name;

  category.appendChild(opt);
}

/* ===== 今日 ===== */
function getToday(){
  let d=new Date();
  return d.toISOString().slice(0,10);
}

draw();

</script>

</body>
</html>
