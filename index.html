<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀絵文字日記</title>

<style>
body{
  font-family:-apple-system,sans-serif;
  background:#fafafa;
  text-align:center;
  margin:0;
  padding:20px;
}

.card{
  max-width:430px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:16px;
}

/* ===== タブ ===== */
.tabs{
  display:flex;
  justify-content:center;
  gap:6px;
}

.tab{
  padding:8px 12px;
  background:#eee;
  border-radius:10px;
  cursor:pointer;
}

.tab.active{
  background:#ff8fab;
  color:white;
}

/* ===== カレンダー ===== */
.weekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  font-size:12px;
  color:#666;
  margin-top:10px;
}

#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:5px;
}

.day{
  background:#eee;
  border-radius:10px;
  height:55px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
}

.day-num{
  position:absolute;
  top:4px;
  left:6px;
  font-size:10px;
  color:#666;
}

.today{
  border:2px solid #ff8fab;
}

.selected{
  outline:3px solid #7dd3fc;
  outline-offset:2px;
}

/* ===== 入力 ===== */
input,select{
  width:90%;
  padding:6px;
  margin:5px;
  border-radius:10px;
  border:1px solid #ddd;
}

/* ===== ボタン ===== */
button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  margin:5px;
}

/* ===== グラフ ===== */
.bar-wrap{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:12px;
  height:200px;
  margin-top:20px;
}

.bar{
  width:28px;
  background:#ff8fab;
  border-radius:6px 6px 0 0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  font-size:12px;
  
  transform-origin: bottom;
animation: growBar 0.6s ease-out;
}
  @keyframes growBar{
  from{ transform: scaleY(0) }
  to{ transform: scaleY(1) }
  }
/* ===== コメント ===== */
.list{
  text-align:left;
}

.item{
  padding:6px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:flex-start;
  gap:8px;
  text-align:left;
}

/* 月タブ */
.month-tabs{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:4px;
  margin:10px 0;
}

.month-tab{
  font-size:12px;
  padding:4px 0;
  border-radius:6px;
  background:#eee;
  cursor:pointer;
}

.month-tab.active{
  background:#ff8fab;
  color:white;
}

.month-tab.today{
  outline:2px solid #7dd3fc;
}
</style>
</head>

<body>

<h1>🎀絵文字日記</h1>

<!-- タブ -->
<div class="tabs">
  <div class="tab active" onclick="showTab('cal')">カレンダー</div>
  <div class="tab" onclick="showTab('graph')">グラフ</div>
  <div class="tab" onclick="showTab('list')">コメント</div>
</div>

<!-- ================= カレンダー ================= -->
<div id="calView" class="card">

  <input type="month" id="monthPicker" onchange="changeMonth()">
  <button onclick="goToday()">今日へ</button>

  <div class="weekdays">
    <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
  </div>

  <div id="calendar"></div>

  <hr>

  <input id="emoji" placeholder="絵文字1つ">
  <input id="comment" placeholder="コメント">

  <button onclick="save()">保存</button>

</div>

<!-- ================= グラフ ================= -->
<div id="graphView" class="card" style="display:none;">

  <h3>グラフ</h3>

  <div id="graph"></div>

</div>

<!-- ================= コメント ================= -->
<div id="listView" class="card" style="display:none;">

  <h3>月別コメント</h3>

  <select id="yearSelect" onchange="renderList()"></select>

  <button onclick="goThisMonth()" id="todayBtn">今月へ</button>

  <div class="month-tabs">
    <div class="month-tab" onclick="setMonth(1)">1</div>
    <div class="month-tab" onclick="setMonth(2)">2</div>
    <div class="month-tab" onclick="setMonth(3)">3</div>
    <div class="month-tab" onclick="setMonth(4)">4</div>
    <div class="month-tab" onclick="setMonth(5)">5</div>
    <div class="month-tab" onclick="setMonth(6)">6</div>
    <div class="month-tab" onclick="setMonth(7)">7</div>
    <div class="month-tab" onclick="setMonth(8)">8</div>
    <div class="month-tab" onclick="setMonth(9)">9</div>
    <div class="month-tab" onclick="setMonth(10)">10</div>
    <div class="month-tab" onclick="setMonth(11)">11</div>
    <div class="month-tab" onclick="setMonth(12)">12</div>
  </div>

  <div id="list"></div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("diary")||"{}");
let current=new Date();
let selectedDate=null;

let selectedMonth=current.getMonth()+1;
let selectedYear=current.getFullYear();

/* ===== タブ ===== */
function showTab(t){

  calView.style.display="none";
  graphView.style.display="none";
  listView.style.display="none";

  document.querySelectorAll(".tab").forEach(e=>e.classList.remove("active"));

  if(t==="cal") calView.style.display="block";
  if(t==="graph"){ graphView.style.display="block"; renderGraph(); }
  if(t==="list"){ listView.style.display="block"; initYear(); renderList(); }

  event.target.classList.add("active");
}

/* ===== 保存（絵文字そのまま） ===== */
function save(){

  let e = emoji.value.charAt(0);
  let c = comment.value;

  let date = selectedDate || new Date().toISOString().slice(0,10);

  data[date]={emoji:e,comment:c};

  localStorage.setItem("diary",JSON.stringify(data));

  draw();
}

/* ===== カレンダー ===== */
function draw(){

  let cal=document.getElementById("calendar");
  cal.innerHTML="";

  let y=current.getFullYear();
  let m=current.getMonth();

  monthPicker.value=`${y}-${String(m+1).padStart(2,"0")}`;

  let first=new Date(y,m,1);
  let last=new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++) cal.innerHTML+="<div></div>";

  for(let d=1;d<=last.getDate();d++){

    let date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    let item=data[date];

    cal.innerHTML+=`
      <div class="day
        ${date===getToday()?'today':''}
        ${date===selectedDate?'selected':''}"
        onclick="selectDay('${date}')">

        <div class="day-num">${d}</div>
        <div>${item?item.emoji:""}</div>
      </div>
    `;
  }
}

/* ===== 日付選択 ===== */
function selectDay(date){

  selectedDate=date;

  let item=data[date];

  emoji.value=item?.emoji||"";
  comment.value=item?.comment||"";

  draw();
}

/* ===== 月 ===== */
function changeMonth(){
  let [y,m]=monthPicker.value.split("-");
  current=new Date(y,m-1,1);
  draw();
}

function goToday(){
  current=new Date();
  draw();
}

/* ===== グラフ ===== */
function renderGraph(){

  let count={};

  for(let v of Object.values(data)){
    let key=v.emoji;
    if(key) count[key]=(count[key]||0)+1;
  }

  graph.innerHTML="";

  let wrap=document.createElement("div");
  wrap.className="bar-wrap";

  let max=Math.max(...Object.values(count),1);
let percent = ((v / Object.values(count).reduce((a,b)=>a+b,0)) * 100).toFixed(1);
  Object.entries(count).forEach(([k,v])=>{

    let box=document.createElement("div");

    let bar=document.createElement("div");
    bar.className="bar";
    bar.style.height=(v/max*180)+"px";
    bar.title = percent + "%";
    

    let label=document.createElement("div");
    label.innerText=k;

    box.appendChild(bar);
    box.appendChild(label);

    wrap.appendChild(box);
  });

  graph.appendChild(wrap);
}

/* ===== コメント ===== */
function initYear(){
  let sel=document.getElementById("yearSelect");
  sel.innerHTML="";
  for(let y=2021;y<=2028;y++){
    sel.innerHTML+=`<option value="${y}">${y}</option>`;
  }
  sel.value=selectedYear;
}

function setMonth(m){
  selectedMonth=m;
  renderList();
  updateMonthUI();
}

function renderList(){

  let y=document.getElementById("yearSelect").value;

  list.innerHTML="";

  let days=new Date(y,selectedMonth,0).getDate();

  for(let d=1; d<=days; d++){

    let date=`${y}-${String(selectedMonth).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    let v=data[date];

    list.innerHTML+=`
      <div class="item" onclick="selectDay('${date}')">
        ${d}日 ${v?v.emoji:""} ${v?v.comment:"  "}
      </div>
    `;
  }

  updateMonthUI();
}

function goThisMonth(){
  let d=new Date();
  selectedYear=d.getFullYear();
  selectedMonth=d.getMonth()+1;

  document.getElementById("yearSelect").value=selectedYear;

  renderList();
  updateMonthUI();
}

function updateMonthUI(){

  document.querySelectorAll(".month-tab").forEach((el,i)=>{
    let m=i+1;
    el.classList.toggle("active",m===selectedMonth);
    el.classList.toggle("today",m===new Date().getMonth()+1);
  });
}

/* ===== 今日 ===== */
function getToday(){
  return new Date().toISOString().slice(0,10);
}

draw();
emoji.addEventListener("input", ()=>{
  emoji.value = emoji.value.charAt(0);
});
</script>

</body>
</html>
