<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絵文字日記</title>

<style>
body{
  font-family:-apple-system,sans-serif;
  background:#fafafa;
  text-align:center;
  margin:0;
  padding:20px;
}

.card{
  max-width:430px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:16px;
}

/* 月選択 */
#monthPicker{
  padding:6px;
  border-radius:10px;
}

/* カレンダー */
#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:10px;
}

/* 日付固定レイアウト */
.day{
  background:#eee;
  border-radius:10px;
  height:55px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
}

/* 数字固定（ブレない） */
.day-num{
  position:absolute;
  top:4px;
  left:6px;
  font-size:10px;
  color:#666;
}

/* 絵文字 */
.day-emoji{
  font-size:18px;
}

/* 今日 */
.today{
  border:2px solid #ff8fab;
}

/* 入力中ハイライト（別色） */
.active-day{
  outline:2px dashed #7dd3fc;
  outline-offset:2px;
}

/* 入力 */
input,textarea{
  width:90%;
  padding:8px;
  margin:5px 0;
  border-radius:10px;
  border:1px solid #ddd;
}

/* ボタン */
button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  margin:5px;
}

/* グラフ */
.circle{
  width:180px;
  height:180px;
  border-radius:50%;
  margin:10px auto;
  background:conic-gradient(#ff8fab 0 120deg,#7dd3fc 120deg 240deg,#cbd5e1 240deg 360deg);
}

/* 月タブ */
.tabs{
  display:flex;
  overflow-x:auto;
  gap:5px;
  margin:10px 0;
}

.tab{
  padding:6px 10px;
  border-radius:10px;
  background:#eee;
  cursor:pointer;
  white-space:nowrap;
}

.tab.active{
  background:#ff8fab;
  color:white;
}

/* 一覧 */
.list-item{
  background:#f5f5f5;
  margin:5px;
  padding:8px;
  border-radius:10px;
  text-align:left;
}
</style>
</head>

<body>

<h1>📔 絵文字日記</h1>

<div class="card">

  <input type="month" id="monthPicker" onchange="changeMonth()">

  <div id="calendar"></div>

  <hr>

  <div id="selected"></div>

  <input id="emoji" placeholder="絵文字1つ" maxlength="2">
  <input id="comment" placeholder="コメント">

  <button onclick="save()">保存</button>
  <button onclick="openGraph()">グラフ</button>
  <button onclick="openList()">一覧</button>

</div>

<!-- グラフ -->
<div id="graphModal" class="card" style="display:none;">
  <h3>📊 グラフ</h3>
  <div class="circle"></div>
  <div id="graphData"></div>
  <button onclick="graphModal.style.display='none'">閉じる</button>
</div>

<!-- 一覧 -->
<div id="listModal" class="card" style="display:none;">
  <h3>📒 月別一覧</h3>

  <div class="tabs" id="monthTabs"></div>
  <div id="list"></div>

  <button onclick="listModal.style.display='none'">閉じる</button>
</div>

<script>

let current=new Date();
let selected=null;

/* ===== 保存（絵文字保持） ===== */
function save(){

  let e=emoji.value.trim();
  let c=comment.value.trim();

  if([...e].length>1){
    alert("絵文字は1つだけ");
    return;
  }

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let date=selected||getToday();

  // 🔥 ここ重要：上書きしても絵文字保持
  let prev=data[date]||{emoji:"",comment:""};

  data[date]={
    emoji:e||prev.emoji,
    comment:c
  };

  localStorage.setItem("diary",JSON.stringify(data));

  draw();
}

/* ===== カレンダー ===== */
function draw(){

  let cal=document.getElementById("calendar");
  cal.innerHTML="";

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let y=current.getFullYear();
  let m=current.getMonth();

  document.getElementById("monthPicker").value=
    `${y}-${String(m+1).padStart(2,"0")}`;

  let first=new Date(y,m,1);
  let last=new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++) cal.innerHTML+="<div></div>";

  for(let d=1;d<=last.getDate();d++){

    let date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    let item=data[date];

    let today=date===getToday();
    let active=date===selected;

    cal.innerHTML+=`
      <div class="day ${today?'today':''} ${active?'active-day':''}"
        onclick="select('${date}')">

        <div class="day-num">${d}</div>
        <div class="day-emoji">${item?item.emoji:""}</div>

      </div>
    `;
  }
}

/* ===== 選択 ===== */
function select(date){

  selected=date;

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  emoji.value=data[date]?.emoji||"";
  comment.value=data[date]?.comment||"";

  document.getElementById("selected").innerText=date;

  draw();
}

/* ===== 月変更 ===== */
function changeMonth(){

  let v=monthPicker.value;
  let [y,m]=v.split("-");

  current=new Date(y,m-1,1);

  draw();
}

/* ===== グラフ ===== */
function openGraph(){

  graphModal.style.display="block";

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let count={};

  Object.values(data).forEach(v=>{
    if(v.emoji) count[v.emoji]=(count[v.emoji]||0)+1;
  });

  graphData.innerHTML=
    Object.entries(count)
    .map(([k,v])=>`${k} ${"●".repeat(v)}`)
    .join("<br>");
}

/* ===== 月別一覧（タブ式） ===== */
function openList(){

  listModal.style.display="block";

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let months=[...new Set(Object.keys(data).map(d=>d.slice(0,7)))];

  monthTabs.innerHTML="";

  months.forEach(m=>{
    let tab=document.createElement("div");
    tab.className="tab";
    tab.innerText=m;

    tab.onclick=()=>showMonth(m,data);

    monthTabs.appendChild(tab);
  });

  if(months[0]) showMonth(months[0],data);
}

function showMonth(m,data){

  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active",t.innerText===m);
  });

  list.innerHTML="";

  for(let [date,v] of Object.entries(data)){
    if(date.startsWith(m)){
      list.innerHTML+=`
        <div class="list-item">
          ${date} ${v.emoji} ${v.comment}
        </div>
      `;
    }
  }
}

/* ===== 今日 ===== */
function getToday(){
  let d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

draw();

</script>

</body>
</html>
