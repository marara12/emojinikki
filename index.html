<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀絵文字日記</title>

<style>
body{
  font-family:-apple-system,sans-serif;
  background:#fafafa;
  text-align:center;
  margin:0;
  padding:20px;
}

.card{
  max-width:450px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:16px;
}

/* 入力 */
input{
  width:90%;
  padding:8px;
  margin:5px;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  margin:5px;
}

/* カレンダー */
#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:10px;
}

.day{
  background:#eee;
  border-radius:10px;
  height:55px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
}

.day-num{
  position:absolute;
  top:4px;
  left:6px;
  font-size:10px;
  color:#666;
}

.today{
  border:2px solid #ff8fab;
}

/* グラフ */
.bar-wrap{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:10px;
  height:200px;
  margin-top:20px;
}

.bar{
  width:25px;
  background:#ff8fab;
  border-radius:6px 6px 0 0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  font-size:14px;
  color:#333;
}

.bar-label{
  margin-top:5px;
  font-size:14px;
}

/* カテゴリ */
select{
  padding:6px;
  border-radius:10px;
  margin:5px;
}
</style>
</head>

<body>

<h1>🎀絵文字日記</h1>

<div class="card">

  <div id="calendar"></div>

  <hr>

  <input id="emoji" placeholder="絵文字1つ">
  <input id="comment" placeholder="コメント">

  <select id="category">
    <option value="感情">感情</option>
    <option value="ご飯">ご飯</option>
    <option value="その他">その他</option>
  </select>

  <button onclick="addCategory()">＋カテゴリ追加</button>

  <button onclick="save()">保存</button>

  <button onclick="setGraph('all')">全体グラフ</button>
  <button onclick="setGraph('category')">カテゴリ別</button>

  <select id="sort" onchange="renderGraph()">
    <option value="desc">多い順</option>
    <option value="asc">少ない順</option>
  </select>

</div>

<!-- グラフ -->
<div class="card">

  <div id="graph"></div>

  <div id="emojiList"></div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("diary")||"{}");
let currentGraph="all";

/* ===== 絵文字フィルタ（文字化け防止） ===== */
function onlyEmoji(str){
  return [...str].filter(c=>/\p{Emoji}/u.test(c)).join("").slice(0,1);
}

/* ===== 保存 ===== */
function save(){

  let e = onlyEmoji(emoji.value);
  let c = comment.value;
  let cat = category.value;

  let date = new Date().toISOString().slice(0,10);

  data[date] = {emoji:e,comment:c,category:cat};

  localStorage.setItem("diary",JSON.stringify(data));

  renderGraph();
}

/* ===== カテゴリ追加 ===== */
function addCategory(){

  let name = prompt("カテゴリ名を入力");

  if(!name) return;

  let opt = document.createElement("option");
  opt.value = name;
  opt.textContent = name;

  category.appendChild(opt);
}

/* ===== グラフ切替 ===== */
function setGraph(type){
  currentGraph=type;
  renderGraph();
}

/* ===== グラフ描画（棒グラフ） ===== */
function renderGraph(){

  let count={};

  for(let v of Object.values(data)){

    if(currentGraph==="category"){
      count[v.category]=(count[v.category]||0)+1;
    }else{
      count[v.emoji]=(count[v.emoji]||0)+1;
    }
  }

  let sorted = Object.entries(count);

  if(sort.value==="desc"){
    sorted.sort((a,b)=>b[1]-a[1]);
  }else{
    sorted.sort((a,b)=>a[1]-b[1]);
  }

  let max = Math.max(...sorted.map(v=>v[1]),1);

  graph.innerHTML="";
  emojiList.innerHTML="";

  let wrap = document.createElement("div");
  wrap.className="bar-wrap";

  sorted.forEach(([k,v])=>{

    let bar = document.createElement("div");
    bar.className="bar";

    bar.style.height = (v/max*180)+"px";

    bar.innerHTML = `<div>${v}</div>`;

    wrap.appendChild(bar);

    emojiList.innerHTML += `<div class="bar-label">${k}</div>`;
  });

  graph.appendChild(wrap);
}

/* 初期 */
renderGraph();

</script>

</body>
</html>
