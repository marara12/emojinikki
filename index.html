<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絵文字日記</title>

<!-- 可愛いフォント -->
<link href="https://fonts.googleapis.com/css2?family=Rounded+M+PLUS+1c:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:"Rounded M PLUS 1c", sans-serif;
  background:#fafafa;
  text-align:center;
  margin:0;
  padding:20px;
}

h1{
  margin:10px;
}

/* カード */
.card{
  max-width:430px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:16px;
}

/* 月選択 */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#monthPicker{
  font-size:16px;
  padding:6px;
  border-radius:10px;
}

/* ボタン */
button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  margin:5px;
}

/* カレンダー */
#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:10px;
}

/* 日付中央 */
.day{
  background:#eee;
  border-radius:10px;
  height:55px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

.day-num{
  font-weight:bold;
  text-align:center;
}

/* 今日 */
.today{
  border:2px solid #ff8fab;
  background:#ffe3ea;
}

/* モーダル */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
}

.modal-content{
  background:white;
  margin:20% auto;
  padding:20px;
  width:85%;
  border-radius:12px;
}

/* グラフ（ドーナツ風） */
.circle{
  width:180px;
  height:180px;
  margin:10px auto;
  border-radius:50%;
  background:conic-gradient(#ff8fab 0deg,#ffd1dc 120deg,#cdeffd 240deg,#eee 360deg);
}

/* リスト */
.list-item{
  background:#f5f5f5;
  margin:5px;
  padding:8px;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>📔 絵文字日記</h1>

<div class="card">

  <!-- 月 + 戻る -->
  <div class="topbar">
    <input type="month" id="monthPicker" onchange="changeMonth()">
    <button onclick="todayMonth()">今日へ</button>
  </div>

  <div id="calendar"></div>

  <hr>

  <div id="selectedDate">日付を選択</div>

  <input id="emoji" placeholder="絵文字1つのみ" maxlength="2">
  <input id="comment" placeholder="コメント">

  <button onclick="save()">保存</button>
  <button onclick="openGraph()">グラフ</button>
  <button onclick="openList()">一覧</button>

</div>

<!-- グラフ -->
<div id="graphModal" class="modal">
  <div class="modal-content">
    <h3>📊 グラフ</h3>

    <div class="circle"></div>
    <div id="graphData"></div>

    <button onclick="closeGraph()">閉じる</button>
  </div>
</div>

<!-- リスト -->
<div id="listModal" class="modal">
  <div class="modal-content">
    <h3>📒 月別一覧</h3>

    <div id="list"></div>

    <button onclick="closeList()">閉じる</button>
  </div>
</div>

<script>

let current = new Date();
let selected = null;

/* ===== 初期 ===== */
document.getElementById("monthPicker").value =
  `${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,"0")}`;

draw();

/* ===== 保存 ===== */
function save(){

  let e = document.getElementById("emoji").value.trim();
  let c = document.getElementById("comment").value.trim();

  if([...e].length > 1){
    alert("絵文字は1つのみ");
    return;
  }

  let data = JSON.parse(localStorage.getItem("diary")||"{}");

  let date = selected || getToday();

  data[date] = {emoji:e, comment:c};

  localStorage.setItem("diary",JSON.stringify(data));

  draw();
}

/* ===== カレンダー ===== */
function draw(){

  let cal = document.getElementById("calendar");
  cal.innerHTML="";

  let data = JSON.parse(localStorage.getItem("diary")||"{}");

  let y=current.getFullYear();
  let m=current.getMonth();

  document.getElementById("monthPicker").value =
    `${y}-${String(m+1).padStart(2,"0")}`;

  let first=new Date(y,m,1);
  let last=new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++){
    cal.innerHTML+="<div></div>";
  }

  for(let d=1;d<=last.getDate();d++){

    let date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    let item=data[date];

    let today=date===getToday();

    cal.innerHTML+=`
      <div class="day ${today?'today':''}" onclick="select('${date}')">
        <div class="day-num">${d}</div>
        <div>${item?item.emoji:""}</div>
      </div>
    `;
  }
}

/* ===== 日付選択 ===== */
function select(date){

  selected=date;

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  document.getElementById("selectedDate").innerText=date;

  document.getElementById("emoji").value=data[date]?.emoji||"";
  document.getElementById("comment").value=data[date]?.comment||"";
}

/* ===== 月変更（スクロール） ===== */
function changeMonth(){

  let v=document.getElementById("monthPicker").value;

  let [y,m]=v.split("-");

  current=new Date(y,m-1,1);

  draw();
}

/* ===== 今日へ ===== */
function todayMonth(){
  current=new Date();
  draw();
}

/* ===== グラフ ===== */
function openGraph(){

  graphModal.style.display="block";

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let count={};

  Object.values(data).forEach(v=>{
    if(v.emoji){
      count[v.emoji]=(count[v.emoji]||0)+1;
    }
  });

  graphData.innerHTML=
    Object.entries(count)
    .map(([k,v])=>`<div onclick="filterEmoji('${k}')">${k} : ${"●".repeat(v)}</div>`)
    .join("");
}

function closeGraph(){
  graphModal.style.display="none";
}

/* ===== 絵文字から日付一覧 ===== */
function filterEmoji(e){

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let list=[];

  for(let [date,val] of Object.entries(data)){
    if(val.emoji===e){
      list.push(`${date} ${val.comment}`);
    }
  }

  alert(list.join("\n"));
}

/* ===== 一覧 ===== */
function openList(){

  listModal.style.display="block";

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  list.innerHTML=
    Object.entries(data)
    .map(([d,v])=>`
      <div class="list-item" onclick="select('${d}')">
        ${d} ${v.emoji} ${v.comment}
      </div>
    `).join("");
}

function closeList(){
  listModal.style.display="none";
}

/* ===== 今日 ===== */
function getToday(){
  let d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

</script>

</body>
</html>
