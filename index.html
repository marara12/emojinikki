<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絵文字日記</title>

<style>
body{
  font-family:-apple-system,sans-serif;
  background:#fafafa;
  text-align:center;
  margin:0;
  padding:20px;
}

/* カード */
.card{
  max-width:430px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:16px;
}

/* 年月ボタン */
#monthBtn{
  cursor:pointer;
  font-weight:bold;
  display:inline-block;
  padding:8px 14px;
  border-radius:20px;
  background:#ffe3ea;
  transition:0.2s;
}
#monthBtn:active{
  transform:scale(0.95);
}

/* 曜日 */
.week{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  font-size:12px;
  color:#888;
  margin-top:10px;
}

/* カレンダー */
#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:10px;
}

.day{
  background:#eee;
  border-radius:10px;
  height:55px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  font-size:12px;
}

/* 数字中央 */
.day-num{
  font-size:14px;
  font-weight:bold;
}

/* 今日 */
.today{
  border:2px solid #ff8fab;
  background:#ffe3ea;
}

/* 入力 */
input, textarea{
  width:90%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:1px solid #ddd;
}

/* ボタン */
button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  margin:5px;
}

/* グラフボタン */
#graphBtn{
  font-weight:bold;
  font-size:14px;
  background:#ffb3c1;
}

/* モーダル */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
}

.modal-content{
  background:white;
  margin:20% auto;
  padding:20px;
  width:85%;
  border-radius:12px;
}

/* 円グラフ */
.circle{
  width:180px;
  height:180px;
  border-radius:50%;
  margin:10px auto;
  background:conic-gradient(#ff8fab 0deg,#ffd1dc 120deg,#cdeffd 240deg,#eee 360deg);
}

/* 編集 */
#editBtn{
  background:#aaa;
}
</style>
</head>

<body>

<h1>📔 絵文字日記</h1>

<div class="card">

  <div id="monthBtn" onclick="openPicker()">2026 / 4 ▼</div>

  <!-- 曜日 -->
  <div class="week">
    <div>日</div><div>月</div><div>火</div>
    <div>水</div><div>木</div><div>金</div><div>土</div>
  </div>

  <div id="calendar"></div>

  <hr>

  <div id="selectedDate">日付未選択</div>

  <input id="emoji" placeholder="絵文字1文字のみ" maxlength="2">
  <textarea id="comment" placeholder="コメント"></textarea>

  <button onclick="save()">保存</button>
  <button id="editBtn" onclick="enableEdit()">編集</button>
  <button id="graphBtn" onclick="openGraph()">グラフ</button>

</div>

<!-- 月選択 -->
<div id="picker" class="modal">
  <div class="modal-content">
    <h3>年月選択</h3>

    <input type="number" id="year" min="2021" max="2028" value="2026">
    <input type="number" id="month" min="1" max="12" value="4">

    <button onclick="setMonth()">決定</button>
  </div>
</div>

<!-- グラフ -->
<div id="graph" class="modal">
  <div class="modal-content">
    <h3>📊 グラフ</h3>

    <div class="circle"></div>
    <div id="graphData"></div>

    <button onclick="closeGraph()">閉じる</button>
  </div>
</div>

<script>

let current = new Date(2026,3,1);
let selected = null;
let editMode = false;

/* ===== 保存制御 ===== */
function save(){

  const e = document.getElementById("emoji").value.trim();
  const c = document.getElementById("comment").value.trim();

  // 絵文字1文字制限
  if([...e].length > 1){
    alert("絵文字は1文字のみ");
    return;
  }

  if(!selected) selected = getToday();

  let data = JSON.parse(localStorage.getItem("diary")||"{}");

  data[selected] = {emoji:e, comment:c};

  localStorage.setItem("diary",JSON.stringify(data));

  draw();
}

/* ===== カレンダー ===== */
function draw(){

  const cal = document.getElementById("calendar");
  cal.innerHTML="";

  let data = JSON.parse(localStorage.getItem("diary")||"{}");

  let y=current.getFullYear();
  let m=current.getMonth();

  document.getElementById("monthBtn").innerText =
    `${y} / ${m+1}`;

  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++){
    cal.innerHTML+="<div></div>";
  }

  for(let d=1;d<=last.getDate();d++){

    let date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    let today=date===getToday();

    let item=data[date];

    cal.innerHTML+=`
      <div class="day ${today?'today':''}" onclick="select('${date}')">
        <div class="day-num">${d}</div>
        <div>${item?item.emoji:""}</div>
      </div>
    `;
  }
}

/* ===== 選択 ===== */
function select(date){

  selected=date;

  let data = JSON.parse(localStorage.getItem("diary")||"{}");

  if(data[date]){
    document.getElementById("emoji").value=data[date].emoji||"";
    document.getElementById("comment").value=data[date].comment||"";
  }else{
    document.getElementById("emoji").value="";
    document.getElementById("comment").value="";
  }

  document.getElementById("selectedDate").innerText=date;
}

/* ===== 編集制御 ===== */
function enableEdit(){
  editMode=true;
}

/* ===== グラフ ===== */
function openGraph(){

  graph.style.display="block";

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let count={};

  Object.values(data).forEach(v=>{
    if(v.emoji){
      count[v.emoji]=(count[v.emoji]||0)+1;
    }
  });

  graphData.innerHTML=
    Object.entries(count)
    .map(([k,v])=>`${k} ${"●".repeat(v)}`)
    .join("<br>");
}

function closeGraph(){
  graph.style.display="none";
}

/* ===== 月変更 ===== */
function openPicker(){
  picker.style.display="block";
}

function setMonth(){

  let y=parseInt(year.value);
  let m=parseInt(month.value)-1;

  if(y<2021||y>2028){
    alert("2021〜2028のみ");
    return;
  }

  current=new Date(y,m,1);

  picker.style.display="none";
  draw();
}

/* ===== 今日 ===== */
function getToday(){
  let d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

draw();

</script>

</body>
</html>
