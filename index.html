<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀絵文字日記</title>

<style>
body{
  font-family:-apple-system,sans-serif;
  background:#fafafa;
  text-align:center;
  margin:0;
  padding:20px;
}

.card{
  max-width:430px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:16px;
}

/* ===== タブ ===== */
.tabs{
  display:flex;
  justify-content:center;
  gap:6px;
}

.tab{
  padding:8px 12px;
  background:#eee;
  border-radius:10px;
  cursor:pointer;
}

.tab.active{
  background:#ff8fab;
  color:white;
}

/* ===== カレンダー ===== */
#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:10px;
}

.day{
  background:#eee;
  border-radius:10px;
  height:55px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

.day-num{
  position:absolute;
  top:4px;
  left:6px;
  font-size:10px;
  color:#666;
}

.today{
  border:2px solid #ff8fab;
}

/* ===== 入力 ===== */
input,select{
  width:90%;
  padding:6px;
  margin:5px;
  border-radius:10px;
  border:1px solid #ddd;
}

/* ===== ボタン ===== */
button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  margin:5px;
}

/* ===== グラフ ===== */
.bar-wrap{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:12px;
  height:200px;
  margin-top:20px;
}

.bar{
  width:28px;
  background:#ff8fab;
  border-radius:6px 6px 0 0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  font-size:12px;
}

.label{
  font-size:14px;
  margin-top:6px;
}
</style>
</head>

<body>

<h1>🎀絵文字日記</h1>

<!-- タブ -->
<div class="tabs">
  <div class="tab active" onclick="showTab('cal')">カレンダー</div>
  <div class="tab" onclick="showTab('graph')">グラフ</div>
  <div class="tab" onclick="showTab('list')">月別</div>
</div>

<!-- ================= カレンダー ================= -->
<div id="calView" class="card">

  <input type="month" id="monthPicker" onchange="changeMonth()">
  <button onclick="goToday()">今日へ</button>

  <div id="calendar"></div>

  <hr>

  <input id="emoji" placeholder="絵文字1つ">
  <input id="comment" placeholder="コメント">

  <select id="category"></select>

  <button onclick="save()">保存</button>

</div>

<!-- ================= グラフ ================= -->
<div id="graphView" class="card" style="display:none;">

  <h3>📊 グラフ</h3>

  <!-- カテゴリ追加はここだけ -->
  <button onclick="addCategory()">＋カテゴリ追加</button>

  <button onclick="mode='emoji';renderGraph()">絵文字</button>
  <button onclick="mode='category';renderGraph()">カテゴリ</button>

  <div id="graph"></div>

</div>

<!-- ================= 月別 ================= -->
<div id="listView" class="card" style="display:none;">

  <h3>📒 月別コメント</h3>

  <input type="month" id="listMonth" onchange="renderList()">
  <button onclick="goThisMonth()">今月へ</button>

  <div id="list"></div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("diary")||"{}");
let mode="emoji";
let current=new Date();

/* ===== タブ ===== */
function showTab(t){

  calView.style.display="none";
  graphView.style.display="none";
  listView.style.display="none";

  document.querySelectorAll(".tab").forEach(e=>e.classList.remove("active"));

  if(t==="cal") calView.style.display="block";
  if(t==="graph"){ graphView.style.display="block"; renderGraph(); }
  if(t==="list"){ listView.style.display="block"; renderList(); }

  event.target.classList.add("active");
}

/* ===== 絵文字修正（文字化け防止） ===== */
function safeEmoji(str){
  return [...str]
    .filter(c=>/\p{Extended_Pictographic}/u.test(c))
    .slice(0,1)
    .join("");
}

/* ===== 保存 ===== */
function save(){

  let e = safeEmoji(emoji.value);
  let c = comment.value;
  let cat = category.value || "";

  let date = new Date().toISOString().slice(0,10);

  data[date]={emoji:e,comment:c,category:cat};

  localStorage.setItem("diary",JSON.stringify(data));

  draw();
}

/* ===== カレンダー ===== */
function draw(){

  let cal=document.getElementById("calendar");
  cal.innerHTML="";

  let y=current.getFullYear();
  let m=current.getMonth();

  monthPicker.value=`${y}-${String(m+1).padStart(2,"0")}`;

  let first=new Date(y,m,1);
  let last=new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++) cal.innerHTML+="<div></div>";

  for(let d=1;d<=last.getDate();d++){

    let date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    let item=data[date];

    cal.innerHTML+=`
      <div class="day ${date===getToday()?'today':''}">
        <div class="day-num">${d}</div>
        <div>${item?item.emoji:""}</div>
      </div>
    `;
  }
}

/* ===== 月移動 ===== */
function changeMonth(){
  let [y,m]=monthPicker.value.split("-");
  current=new Date(y,m-1,1);
  draw();
}

function goToday(){
  current=new Date();
  draw();
}

/* ===== グラフ ===== */
function renderGraph(){

  let count={};

  for(let v of Object.values(data)){
    let key = mode==="emoji" ? v.emoji : v.category;
    if(key) count[key]=(count[key]||0)+1;
  }

  let arr=Object.entries(count);
  let max=Math.max(...arr.map(v=>v[1]),1);

  graph.innerHTML="";

  let wrap=document.createElement("div");
  wrap.className="bar-wrap";

  arr.forEach(([k,v])=>{

    let container=document.createElement("div");

    let bar=document.createElement("div");
    bar.className="bar";
    bar.style.height=(v/max*180)+"px";
    bar.innerHTML=v;

    let label=document.createElement("div");
    label.className="label";
    label.innerText=k;

    container.appendChild(bar);
    container.appendChild(label);

    wrap.appendChild(container);
  });

  graph.appendChild(wrap);
}

/* ===== 月別 ===== */
function renderList(){

  let m=listMonth.value;

  list.innerHTML="";

  let arr=Object.entries(data)
    .filter(([d])=>d.startsWith(m))
    .sort((a,b)=>new Date(a[0])-new Date(b[0]));

  arr.forEach(([d,v])=>{
    list.innerHTML+=`
      <div>
        ${d} ${v.emoji} ${v.comment}
      </div>
    `;
  });
}

/* ===== 今月へ（修正版） ===== */
function goThisMonth(){

  let d=new Date();

  let m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;

  listMonth.value=m;

  renderList();
}

/* ===== カテゴリ追加 ===== */
function addCategory(){

  let name=prompt("カテゴリ名");

  if(!name) return;

  let opt=document.createElement("option");
  opt.value=name;
  opt.textContent=name;

  category.appendChild(opt);
}

/* ===== 今日 ===== */
function getToday(){
  return new Date().toISOString().slice(0,10);
}

draw();

</script>

</body>
</html>
