<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絵文字日記</title>

<style>
body{
  font-family:-apple-system,sans-serif;
  text-align:center;
  background:#fafafa;
  margin:0;
  padding:20px;
}

/* カード */
.card{
  max-width:420px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:16px;
}

/* 入力 */
input{
  width:90%;
  padding:12px;
  font-size:18px;
  text-align:center;
}

/* ボタン */
button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  margin:5px;
}

/* カレンダー */
#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:10px;
}

.day{
  background:#eee;
  border-radius:8px;
  padding:8px;
  min-height:45px;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 今日 */
.today{
  border:2px solid #ff8fab;
  background:#ffe3ea;
}

/* 月タイトル */
#month{
  cursor:pointer;
  font-weight:bold;
}

/* モーダル */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.4);
}

.modal-content{
  background:white;
  margin:20% auto;
  padding:20px;
  width:80%;
  border-radius:12px;
}

/* 円グラフ */
.circle{
  width:200px;
  height:200px;
  margin:20px auto;
  border-radius:50%;
  background:conic-gradient(#ff8fab 0deg,#ffd1dc 120deg,#cdeffd 240deg,#eee 360deg);
}

/* 検索結果 */
.result{
  cursor:pointer;
  padding:5px;
  background:#f5f5f5;
  margin:5px;
  border-radius:6px;
}
</style>
</head>

<body>

<h1>📔 絵文字日記</h1>

<div class="card">

  <div id="month" onclick="openPicker()">2026 / 4 ▼</div>

  <input id="input" placeholder="絵文字3つまで" maxlength="3">

  <div>
    <button onclick="save()">保存</button>
    <button onclick="openStats()">📊</button>
  </div>

  <div id="calendar"></div>

  <hr>

  <input id="search" placeholder="絵文字検索" oninput="searchEmoji()">
  <div id="searchResult"></div>

</div>

<!-- 月選択 -->
<div id="picker" class="modal">
  <div class="modal-content">
    <h3>年月選択</h3>
    <input type="number" id="year" value="2026">
    <input type="number" id="month" value="4">
    <button onclick="setMonth()">決定</button>
  </div>
</div>

<!-- stats -->
<div id="stats" class="modal">
  <div class="modal-content">
    <h3>📊 分析</h3>
    <div class="circle"></div>
    <div id="chart"></div>
    <button onclick="closeStats()">閉じる</button>
  </div>
</div>

<script>

let current = new Date(2026,3,1);

/* 保存 */
function save(){

  let val = input.value.trim();

  if(val.length>3){
    alert("絵文字は3つまで");
    return;
  }

  let data = JSON.parse(localStorage.getItem("diary")||"{}");

  let date = selected || getToday();

  data[date]=val;

  localStorage.setItem("diary",JSON.stringify(data));

  input.value="";
  draw();
}

/* カレンダー */
let selected=null;

function draw(){

  const cal = document.getElementById("calendar");
  cal.innerHTML="";

  let data = JSON.parse(localStorage.getItem("diary")||"{}");

  let y=current.getFullYear();
  let m=current.getMonth();

  document.getElementById("month").innerText =
    `${y} / ${m+1}`;

  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++){
    cal.innerHTML+="<div></div>";
  }

  for(let d=1;d<=last.getDate();d++){

    let date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    let today=date===getToday();

    cal.innerHTML+=`
      <div class="day ${today?'today':''}"
        onclick="select('${date}')">
        ${d}<br>${data[date]||""}
      </div>
    `;
  }
}

/* 日付選択 */
function select(d){
  selected=d;
  let data=JSON.parse(localStorage.getItem("diary")||"{}");
  input.value=data[d]||"";
}

/* 今日 */
function getToday(){
  let d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

/* 月変更 */
function openPicker(){
  picker.style.display="block";
}

function setMonth(){
  let y=year.value;
  let m=month.value-1;
  current=new Date(y,m,1);
  picker.style.display="none";
  draw();
}

/* stats */
function openStats(){

  stats.style.display="block";

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let count={};

  Object.values(data).forEach(v=>{
    for(let e of v){
      count[e]=(count[e]||0)+1;
    }
  });

  chart.innerHTML=
    Object.entries(count)
    .map(([k,v])=>`${k} : ${"●".repeat(v)}`)
    .join("<br>");
}

function closeStats(){
  stats.style.display="none";
}

/* 検索 */
function searchEmoji(){

  let q=search.value;
  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  searchResult.innerHTML="";

  for(let [date,val] of Object.entries(data)){

    if(val.includes(q) && q){

      let div=document.createElement("div");
      div.className="result";
      div.innerText=`${date} ${val}`;

      div.onclick=()=>select(date);

      searchResult.appendChild(div);
    }
  }
}

draw();

</script>

</body>
</html>
