<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絵文字日記</title>

<link href="https://fonts.googleapis.com/css2?family=Rounded+M+PLUS+1c:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:"Rounded M PLUS 1c",sans-serif;
  background:#fafafa;
  text-align:center;
  margin:0;
  padding:20px;
}

.card{
  max-width:430px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:16px;
}

/* 上部 */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* カレンダー */
#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:10px;
}

/* 日付 */
.day{
  background:#eee;
  border-radius:10px;
  height:55px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
}

.day-num{
  position:absolute;
  top:4px;
  left:6px;
  font-size:10px;
  color:#666;
}

.day-emoji{
  font-size:18px;
}

/* 今日 */
.today{
  border:2px solid #ff8fab;
}

/* 選択中 */
.active{
  outline:2px dashed #7dd3fc;
}

/* 入力 */
input{
  width:90%;
  padding:8px;
  margin:5px;
  border-radius:10px;
  border:1px solid #ddd;
}

/* ボタン */
button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  margin:5px;
}

/* モーダル */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
}

.modal-content{
  background:white;
  margin:15% auto;
  padding:20px;
  width:90%;
  border-radius:12px;
}

/* タブ */
.tabs{
  display:flex;
  gap:5px;
  overflow-x:auto;
}

.tab{
  padding:6px 10px;
  background:#eee;
  border-radius:10px;
  cursor:pointer;
  white-space:nowrap;
}

.tab.active{
  background:#ff8fab;
  color:white;
}

/* 一覧（左詰め＋古い→新しい） */
.list{
  text-align:left;
}

.item{
  padding:6px;
  border-bottom:1px solid #eee;
}

/* グラフ */
.circle{
  width:180px;
  height:180px;
  border-radius:50%;
  margin:10px auto;
  background:conic-gradient(#ff8fab 0 120deg,#7dd3fc 120deg 240deg,#cbd5e1 240deg 360deg);
}
</style>
</head>

<body>

<h1>📔 絵文字日記</h1>

<div class="card">

  <div class="topbar">
    <input type="month" id="monthPicker" onchange="changeMonth()">
    <button onclick="goToday()">今日へ</button>
  </div>

  <div id="calendar"></div>

  <hr>

  <div id="selected"></div>

  <input id="emoji" placeholder="絵文字1つ" maxlength="2" oninput="emojiFilter(this)">
  <input id="comment" placeholder="コメント">

  <button onclick="save()">保存</button>
  <button onclick="openGraph()">グラフ</button>
  <button onclick="openList()">一覧</button>

</div>

<!-- グラフ -->
<div id="graph" class="modal">
  <div class="modal-content">
    <h3>📊 グラフ</h3>
    <div class="circle"></div>
    <div id="graphData"></div>
    <button onclick="graph.style.display='none'">閉じる</button>
  </div>
</div>

<!-- 一覧 -->
<div id="listModal" class="modal">
  <div class="modal-content">

    <h3>📒 月別一覧</h3>

    <button onclick="goTodayMonth()">今月へ</button>

    <div class="tabs" id="tabs"></div>

    <div id="list" class="list"></div>

    <button onclick="listModal.style.display='none'">閉じる</button>
  </div>
</div>

<script>

let current=new Date();
let selected=null;

/* ===== 絵文字フィルタ（文字化け対策） ===== */
function emojiFilter(el){
  el.value=[...el.value]
    .filter(c=>/\p{Emoji}/u.test(c))
    .join("")
    .slice(0,1);
}

/* ===== 保存（保持修正） ===== */
function save(){

  let e=emoji.value;
  let c=comment.value;

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let date=selected||getToday();

  let prev=data[date]||{emoji:"",comment:""};

  data[date]={
    emoji:e||prev.emoji,
    comment:c
  };

  localStorage.setItem("diary",JSON.stringify(data));

  draw();
}

/* ===== カレンダー ===== */
function draw(){

  let cal=document.getElementById("calendar");
  cal.innerHTML="";

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let y=current.getFullYear();
  let m=current.getMonth();

  monthPicker.value=`${y}-${String(m+1).padStart(2,"0")}`;

  let first=new Date(y,m,1);
  let last=new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++) cal.innerHTML+="<div></div>";

  for(let d=1;d<=last.getDate();d++){

    let date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    let item=data[date];

    cal.innerHTML+=`
      <div class="day ${date===getToday()?'today':''} ${date===selected?'active':''}"
        onclick="select('${date}')">

        <div class="day-num">${d}</div>
        <div class="day-emoji">${item?item.emoji:""}</div>

      </div>
    `;
  }
}

/* ===== 選択 ===== */
function select(date){

  selected=date;

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  emoji.value=data[date]?.emoji||"";
  comment.value=data[date]?.comment||"";

  selectedDiv.innerText=date;

  draw();
}

/* ===== 月変更 ===== */
function changeMonth(){
  let v=monthPicker.value;
  let [y,m]=v.split("-");
  current=new Date(y,m-1,1);
  draw();
}

/* ===== 今日へ ===== */
function goToday(){
  current=new Date();
  draw();
}

/* ===== 今月へ（一覧用） ===== */
function goTodayMonth(){
  current=new Date();
  draw();
  listModal.style.display="none";
}

/* ===== グラフ ===== */
function openGraph(){

  graph.style.display="block";

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let count={};

  Object.values(data).forEach(v=>{
    if(v.emoji) count[v.emoji]=(count[v.emoji]||0)+1;
  });

  graphData.innerHTML=
    Object.entries(count)
    .map(([k,v])=>`${k} ${"●".repeat(v)}`)
    .join("<br>");
}

/* ===== 一覧（月タブ＋古い→新しい） ===== */
function openList(){

  listModal.style.display="block";

  let data=JSON.parse(localStorage.getItem("diary")||"{}");

  let months=[...new Set(Object.keys(data).map(d=>d.slice(0,7)))];

  tabs.innerHTML="";

  months.forEach(m=>{
    let t=document.createElement("div");
    t.className="tab";
    t.innerText=m;
    t.onclick=()=>showMonth(m,data);
    tabs.appendChild(t);
  });

  if(months[0]) showMonth(months[0],data);
}

/* 並び修正：古い→新しい */
function showMonth(m,data){

  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active",t.innerText===m);
  });

  let entries=Object.entries(data)
    .filter(([d])=>d.startsWith(m))
    .sort((a,b)=>new Date(a[0]) - new Date(b[0])); // ←重要

  list.innerHTML="";

  entries.forEach(([d,v])=>{
    list.innerHTML+=`
      <div class="item">
        ${d.slice(8,10)}日 ${v.emoji} ${v.comment}
      </div>
    `;
  });
}

/* ===== 今日 ===== */
function getToday(){
  let d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

draw();

</script>

</body>
</html>
